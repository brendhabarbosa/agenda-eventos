<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
</head>
<body>
    <main>
        {% for evento in eventos %}
            <div class="evento">
                <h2>{{ evento.titulo }}</h2>
                <p>{{ evento.inicio }}</p>
                <a href="{% url 'eventos:local' evento.local.id %}">{{ evento.local.nome }}</a>
                {%for categoria in evento.categoria.all%}
                    <a href="{% url 'eventos:index' %}?categoria={{ categoria.id }}"> {{ categoria.nome }}</a>
                {%endfor%}
            </div>
        {% endfor %}
    </main>
</body>
</html>
